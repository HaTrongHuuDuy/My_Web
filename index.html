<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu Hỏi</title>
    <!-- Thư viện pháo hoa canvas-confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow: hidden;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #4a5568;
            line-height: 1.4;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-dung {
            background-color: #48bb78;
            color: white;
        }

        .btn-dung:hover {
            background-color: #38a169;
            transform: translateY(-2px);
        }

        .btn-sai {
            background-color: #f56565;
            color: white;
        }

        .btn-sai:hover {
            background-color: #48bb78; /* Khi sờ chuột vào sẽ đổi sang màu xanh */
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hmai có bị khùng không?</h1>
        <div class="btn-container">
            <button class="btn btn-dung" onclick="chonDung()">Có</button>
            <button id="btnSai" class="btn btn-sai" onmouseover="doiThanhDung()" onclick="xuLyClickSai()">Không</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        const btnSai = document.getElementById('btnSai');
        const result = document.getElementById('result');
        let daDoi = false; // Biến kiểm tra trạng thái nút Sai đã chuyển thành Có chưa

        // Tạo âm thanh chúc mừng bằng Web Audio API (Không cần link nhạc ngoài, chạy luôn lập tức)
        function playSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Nốt nhạc vui tươi (Giai điệu chiến thắng ngắn gọn)
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + index * 0.1);
                    osc.stop(audioCtx.currentTime + index * 0.1 + 0.3);
                });
            } catch (e) {
                console.log("Trình duyệt chặn âm thanh tự động");
            }
        }

        // Hiệu ứng bắn pháo hoa
        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Khi sờ chuột vào nút "Không"
        function doiThanhDung() {
            btnSai.innerText = "Có";
            btnSai.style.backgroundColor = "#48bb78";
            daDoi = true;
        }

        // Khi chọn đáp án đúng
        function chonDung() {
            result.style.color = "#38a169";
            result.innerText = "Hmai giỏi quá ta!";
            
            // Kích hoạt hiệu ứng âm thanh và pháo hoa
            playSound();
            triggerConfetti();
        }

        // Khi bấm vào nút "Không" (trên điện thoại hoặc bấm nhanh)
        function xuLyClickSai() {
            if (!daDoi) {
                let xacNhan = confirm("Chắc là có đúng k?");
                if (xacNhan) {
                    chonDung();
                }
            } else {
                chonDung();
            }
        }
    </script>

</body>
</html>
